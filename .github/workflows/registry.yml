name: Registry Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'registry/**'
      - 'src/**'
      - 'package.json'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Build CLI (Required for Registry Builder)
      run: pnpm run build

    - name: Build Registry JSONs
      run: pnpm run build-registry

    - name: Prepare Docs Site
      run: |
        mkdir -p docs/dist-registry
        cp -r dist-registry/* docs/dist-registry/
        # Optional: verify the files are there
        ls -R docs/dist-registry

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
