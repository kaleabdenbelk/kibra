<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibra Showroom | 🫐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- PrismJS for Elite Code Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        pre[class*="language-"] {
            margin: 0;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div class="max-w-5xl mx-auto px-6 py-12">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl font-bold tracking-tight text-blue-600">🫐 Kibra</h1>
                <p class="text-slate-500 mt-2">The Elite Expo Component Registry.</p>
            </div>
            <a href="https://github.com/user/kibra" class="text-sm font-medium hover:underline text-slate-600">GitHub</a>
        </header>

        <div class="grid md:grid-cols-4 gap-8">
            <!-- Sidebar -->
            <aside class="md:col-span-1">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">Components</h2>
                <nav id="component-list" class="space-y-1">
                    <p class="text-sm text-slate-400">Loading components...</p>
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="md:col-span-3 bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
                <div id="content">
                    <h2 class="text-2xl font-bold mb-4">Welcome to the Showroom</h2>
                    <p class="text-slate-600 leading-relaxed mb-6">
                        Select a component from the sidebar to view its code and installation command.
                        Kibra components are built for Expo with NativeWind and full accessibility support.
                    </p>
                    <div class="bg-slate-900 rounded-lg p-6 text-slate-50 overflow-x-auto">
                        <code>npx kibra init</code>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        async function loadRegistry() {
            try {
                // In production, this would be your GitHub Pages URL
                // For development, it points to the local dist-registry
                const response = await fetch('../dist-registry/index.json');
                const components = await response.json();
                
                const list = document.getElementById('component-list');
                list.innerHTML = '';
                
                components.forEach(comp => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors hover:bg-slate-100 text-slate-700";
                    btn.textContent = comp.name.charAt(0).toUpperCase() + comp.name.slice(1);
                    btn.onclick = () => showComponent(comp.name);
                    list.appendChild(btn);
                });
            } catch (err) {
                console.error("Failed to load registry index", err);
            }
        }

        async function showComponent(name) {
            const content = document.getElementById('content');
            content.innerHTML = '<p class="text-slate-400">Loading...</p>';

            try {
                const response = await fetch(`../dist-registry/${name}.json`);
                const data = await response.json();

                content.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 class="text-3xl font-bold text-slate-900">${data.name.charAt(0).toUpperCase() + data.name.slice(1)}</h2>
                            <p class="text-slate-500 mt-1">${data.type}</p>
                        </div>
                        <div class="flex space-x-2">
                             ${data.dependencies.map(d => `<span class="px-2 py-1 bg-slate-100 text-slate-600 text-[10px] rounded uppercase font-bold">${d}</span>`).join('')}
                        </div>
                    </div>

                    <div class="mb-8">
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Installation</label>
                        <div class="bg-slate-900 rounded-lg p-4 font-mono text-sm text-blue-400 flex justify-between items-center">
                            <code>npx kibra add ${data.name}</code>
                            <button onclick="copyToClipboard('npx kibra add ${data.name}', this)" class="text-slate-500 hover:text-white underline text-xs transition-colors">Copy</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Source Code</label>
                        <div class="relative group">
                            <pre class="language-tsx"><code id="code-block">${escapeHtml(data.files[0].content)}</code></pre>
                        </div>
                    </div>
                `;
                // Trigger Prism highlighting
                Prism.highlightElement(document.getElementById('code-block'));
            } catch (err) {
                content.innerHTML = `<p class="text-red-500">Error loading component data.</p>`;
            }
        }

        async function copyToClipboard(text, btn) {
            await navigator.clipboard.writeText(text);
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            btn.classList.add('text-green-400');
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.remove('text-green-400');
            }, 2000);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        loadRegistry();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</body>
</html>
